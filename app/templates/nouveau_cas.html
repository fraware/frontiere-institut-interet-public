{% extends "base.html" %}
{% block title %}Nouvel épisode — FRONTIÈRE - INSTITUT POUR L’INTÉRÊT PUBLIC -{% endblock %}
{% block content %}
<section class="page-head"><div><p class="eyebrow">SAISINE</p><h1>Nouveau cas</h1><p>Commencer par le problème observé. La solution vient ensuite.</p></div></section>
<form method="post" action="/episodes" class="panel form-grid">
  <label>Institution<input required name="organization_name" placeholder="Ex. Direction générale..."></label>
  <label>Direction / unité<input name="organizational_unit"></label>
  <label class="wide">Titre opérationnel<input required name="title" placeholder="Ex. Évaluer un système de prévision avant décision d'achat"></label>
  <label class="wide">Situation actuelle<textarea required name="current_situation" rows="4"></textarea></label>
  <label class="wide">Résultat recherché<textarea required name="desired_outcome" rows="3"></textarea></label>
  <label>Maturité du besoin<select name="demand_level">
<option value="D0">Simple intérêt</option>
<option value="D1">Problème historique documenté</option>
<option value="D2">Besoin actuel avec responsable identifié</option>
<option value="D3">Besoin actuel avec ressources engagées</option>
<option value="D4">Besoin immédiatement activable</option>
</select></label>
  <label>Sensibilité<select name="sensitivity_level"><option value="1">1 — ordinaire</option><option value="2">2 — interne</option><option value="3" disabled>3 — instance sécurisée requise</option><option value="4" disabled>4 — instance sécurisée requise</option></select></label>
  <label>Besoin existant avant la prise de contact avec FRONTIÈRE<select name="need_preexisting_frontiere"><option value="unknown">Inconnu</option><option value="yes">Oui</option><option value="no">Non</option></select></label>
  <label>Échéance utile<input type="date" name="latest_useful_date"></label>
  <label class="wide">Responsable institutionnel<input name="sponsor"></label>
  <label class="wide">Situation sans FRONTIÈRE — que ferait réellement l'institution ?<textarea name="counterfactual_plan" rows="3"></textarea></label>
  <label class="wide">Hypothèse initiale de FRONTIÈRE<textarea name="initial_frontiere_hypothesis" rows="3" placeholder="Obstacle anticipé, voie envisagée, principales incertitudes."></textarea></label>
  <div class="wide actions"><button class="button primary" type="submit">Créer le cas</button></div>
</form>
{% endblock %}
