# FRONTIÈRE — configuration gratuite de présentation uniquement.
# Aucun collecteur ni base persistante ne s'exécute sur ce site statique.
# La collecte et la conservation des données restent des chantiers
# indépendants, prévus sur GitHub Actions et les archives versionnées.
# Ne jamais ajouter un plan payant ou un disque sans autorisation explicite.
projects:
  - name: Frontiere
    environments:
      - name: Production
        services:
          - type: web
            name: frontiere-observatoire-public
            runtime: static
            buildCommand: test -f site_frontiere/index.html
            staticPublishPath: ./site_frontiere
            autoDeployTrigger: "off"
            previews:
              generation: "off"
