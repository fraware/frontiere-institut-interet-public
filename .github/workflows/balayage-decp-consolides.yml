name: "Balayage complet de trois fichiers DECP consolidés"

on:
  push:
    branches: [main]
    paths:
      - "scripts/balayer_fichiers_consolides_decp.py"
      - "tests/test_balayer_fichiers_consolides_decp.py"
      - ".github/workflows/balayage-decp-consolides.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: balayage-decp-consolides-trois-mois
  cancel-in-progress: false

jobs:
  examiner:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Télécharger, vérifier et balayer trois fichiers mensuels
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Lire la révision du programme
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Contrôler le protocole sans accès au réseau
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_balayer_fichiers_consolides_decp.py

      - name: Retrouver et vérifier le rapport des 17 avis BOAMP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/boamp-chaines"
          mkdir -p "$SRC"
          gh run download 38480457531 \
            --repo "$GITHUB_REPOSITORY" \
            --name chaines-documentaires-acheteurs-17-38480457531 \
            --dir "$SRC"
          (
            cd "$SRC"
            echo "8a9f220a66f61a4a0e1ea0104e3fd9c7a23395e791866e997b10922bfcaf82b8  chaines-documentaires-17.json" | sha256sum --check
          )

      - name: Télécharger trois ressources officielles et compter tous leurs marchés
        shell: bash
        run: |
          set -euo pipefail
          python scripts/balayer_fichiers_consolides_decp.py \
            --chaines "$RUNNER_TEMP/boamp-chaines/chaines-documentaires-17.json" \
            --etat institutionnel/decp/etat_ressources.json \
            --sortie "$RUNNER_TEMP/decp-mois-verifies"

      - name: Contrôler les dénominateurs et les limites des rapprochements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "decp-mois-verifies" / "rapport.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          if (d["nombre_fichiers_analyses"] != 3
                  or d["nombre_references_contractuelles"] != 7
                  or d["contrats_juridiquement_demontrés"] != 0):
              raise SystemExit("Dénominateurs contractuels incohérents")
          for s in d["sources"]:
              x = s["mesures"]
              if (not s["fichier_integral_parcouru"]
                      or x["notices_marche_lues"] !=
                      x["notices_normalisees"] + x["notices_marche_rejetees"]):
                  raise SystemExit("Source mensuelle non analysée intégralement")
          print(json.dumps({
              "mois": d["mois_examines"],
              "mesures": d["statistiques_globales_avec_repetitions_possibles"],
              "candidats_meme_siret": d["candidats_decp_meme_siret"],
              "contracts_confirmes": 0,
          }, ensure_ascii=False))
          PY

      - name: Conserver rapport et trois fichiers sources exactement téléchargés
        uses: actions/upload-artifact@v4
        with:
          name: balayage-decp-consolides-3-mois-${{ github.run_id }}
          path: ${{ runner.temp }}/decp-mois-verifies/
          retention-days: 14
          if-no-files-found: error
