name: Amorçage du territoire DILA

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/ingerer_annuaire_local.py"
      - "scripts/rechercher_competence_geographique.py"
      - "tests/test_ingestion_annuaire_local.py"
      - ".github/workflows/amorcage-annuaire-local.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amorcage-annuaire-local
  cancel-in-progress: true

jobs:
  ingestion:
    name: Ingérer les services publics locaux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v7
        with:
          ref: institutionnel/territoire-integral-v1
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils de test
        run: python -m pip install "pytest>=8,<10"

      - name: Vérifier l'importeur
        run: python -m pytest -q tests/test_ingestion_annuaire_local.py

      - name: Ingérer l'API Annuaire
        run: python scripts/ingerer_annuaire_local.py

      - name: Contrôler les bornes de sécurité
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("institutionnel/statistiques_annuaire_local.json").read_text(encoding="utf-8"))

          assert s["nombre_enregistrements_export_complet"] >= 90000, s
          assert s["nombre_services_locaux_source"] >= 80000, s
          assert s["nombre_entites_canoniques"] == s["nombre_services_locaux_source"]
          assert s["categories_export"].get("SI", 0) >= 7000
          assert s["stockage"]["octets_total_canonique"] < 300_000_000, s["stockage"]

          print(json.dumps(s, ensure_ascii=False))
          PY

      - name: Enregistrer le snapshot initial
        shell: bash
        run: |
          git add             institutionnel/entites/locales             institutionnel/relations/locales             institutionnel/instantanes/annuaire_local_manifest.json             institutionnel/statistiques_annuaire_local.json             institutionnel/anomalies_annuaire_local.json             institutionnel/resolution_roae_local.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git config user.name "frontiere-referentiel"
          git config user.email "frontiere-referentiel@users.noreply.github.com"
          git commit -m "Territoire DILA — amorcer les services publics locaux"
          git push origin HEAD:institutionnel/territoire-integral-v1
