name: "Veille des programmes scientifiques ANR"

on:
  schedule:
    - cron: "21 7 * * *"
  workflow_dispatch:
    inputs:
      publier:
        description: "Soumettre un état changé en proposition contrôlée"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/surveiller_programmes_scientifiques.py"
      - "tests/test_surveiller_programmes_scientifiques.py"
      - "scripts/publier_mise_a_jour_institutionnelle.py"
      - "institutionnel/programmes_scientifiques/sources_v1.json"
      - ".github/workflows/veille-programmes-scientifiques.yml"

permissions:
  contents: read

concurrency:
  group: frontiere-veille-programmes-anr
  cancel-in-progress: false

jobs:
  surveillance:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Récupérer main sans conserver les identifiants
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier les contrats sans accès réseau
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_surveiller_programmes_scientifiques.py tests/test_publication_institutionnelle.py

      - name: Relever les publications officielles ANR
        id: observation
        shell: bash
        run: |
          set +e
          python -m scripts.surveiller_programmes_scientifiques \
            --bilan-json "$RUNNER_TEMP/anr-bilan.json" \
            --bilan-markdown "$RUNNER_TEMP/anr-bilan.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" != "0" && "$code" != "2" ]]; then
            exit "$code"
          fi

      - name: Proposer uniquement les nouvelles empreintes officielles
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publier)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publier_mise_a_jour_institutionnelle.py --source programmes --publier

      - name: Résumer les observations et les limites probatoires
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/anr-bilan.md" ]]; then
            cat "$RUNNER_TEMP/anr-bilan.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bilan absent : examiner les journaux." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver le rapport technique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anr-veille-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/anr-bilan.json
            ${{ runner.temp }}/anr-bilan.md
          if-no-files-found: warn
          retention-days: 30

      - name: Signaler les sources non accessibles
        if: steps.observation.outputs.code == '2'
        run: |
          echo "Une ou plusieurs publications ANR n'ont pas pu être consultées."
          exit 2
