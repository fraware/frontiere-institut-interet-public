name: "Relecture des trois fichiers DECP sans nouveau téléchargement"

on:
  push:
    branches: [main]
    paths:
      - "scripts/balayer_fichiers_consolides_decp.py"
      - "tests/test_balayer_fichiers_consolides_decp.py"
      - ".github/workflows/relecture-decp-consolides.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: relecture-decp-consolides-trois-mois
  cancel-in-progress: false

jobs:
  relire:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Contrôler les sources primaires et requalifier les offres NC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Lire la révision exacte
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python 3.12 et exécuter les essais sans réseau
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Contrôler la relecture sans accès distant
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_balayer_fichiers_consolides_decp.py

      - name: Restaurer les fichiers DECP originaux et le rapport BOAMP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/decp-relecture"
          mkdir -p "$ROOT/origine" "$ROOT/chaines"
          gh run download 38481650597 \
            --repo "$GITHUB_REPOSITORY" \
            --name balayage-decp-consolides-3-mois-38481650597 \
            --dir "$ROOT/origine"
          gh run download 38480457531 \
            --repo "$GITHUB_REPOSITORY" \
            --name chaines-documentaires-acheteurs-17-38480457531 \
            --dir "$ROOT/chaines"
          (
            cd "$ROOT/chaines"
            echo "8a9f220a66f61a4a0e1ea0104e3fd9c7a23395e791866e997b10922bfcaf82b8  chaines-documentaires-17.json" | sha256sum --check
          )
          (
            cd "$ROOT/origine"
            echo "5ea20aa0b0b2e7fd81029ccb514b1c4f5bac514016cd1f333e435e5e0407bc3a  rapport.json" | sha256sum --check
            echo "cc15f6dc1b980bfa73f90b120bd61e731a94dd861a080be520b9c8797af02ae9  fichiers-officiels/decp-2025-08.json" | sha256sum --check
            echo "4813dcade685770115ba10a74837cdc3bf89b5418360f232de19aa7161420caf  fichiers-officiels/decp-2026-02.json" | sha256sum --check
            echo "8114588fa9e459fa88a193d959c65945587d7402d8f21f5254663a6cdadb1364  fichiers-officiels/decp-2026-04.json" | sha256sum --check
          )

      - name: Recalculer la couverture complète sans nouveau réseau
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/decp-relecture"
          python scripts/balayer_fichiers_consolides_decp.py \
            --chaines "$ROOT/chaines/chaines-documentaires-17.json" \
            --archives "$ROOT/origine" \
            --sortie "$ROOT/rapport-relecture.json"
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "decp-relecture" / "rapport-relecture.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          x = d["statistiques_globales_avec_repetitions_possibles"]
          if (x["notices_marche_lues"] != 85181
                  or x.get("offres_recues_non_communiquees_nc") != 21922
                  or x["notices_normalisees"] != 85181
                  or x.get("notices_marche_rejetees", 0) != 0
                  or d["nombre_fichiers_analyses"] != 3
                  or d["contrats_juridiquement_demontrés"] != 0):
              raise SystemExit("Dénominateurs de la relecture hors réseau inattendus")
          print(json.dumps({
              "notices": x["notices_marche_lues"],
              "mentions_offres_nc": x["offres_recues_non_communiquees_nc"],
              "normalisees": x["notices_normalisees"],
              "candidats_meme_siret": d["candidats_decp_meme_siret"],
              "liens_juridiques": 0,
          }, ensure_ascii=False))
          PY

      - name: Publier le rapport de relecture et la provenance des archives
        uses: actions/upload-artifact@v4
        with:
          name: relecture-decp-nc-${{ github.run_id }}
          path: ${{ runner.temp }}/decp-relecture/rapport-relecture.json
          retention-days: 30
          if-no-files-found: error
