name: "Contrôle transversal de la veille"

on:
  schedule:
    - cron: "11 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/auditer_fraicheur_veille.py"
      - "tests/test_auditer_fraicheur_veille.py"
      - "institutionnel/veille/controle_v1.json"
      - ".github/workflows/controle-veille.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: frontiere-controle-veille
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: "Vérifier les relevés et les procédures"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Lire la branche principale sans jeton persistant
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tester le contrôleur sans accès réseau
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_auditer_fraicheur_veille.py

      - name: Contrôler les relevés et les dernières exécutions GitHub
        id: diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/auditer_fraicheur_veille.py \
            --repertoire-github "$GITHUB_REPOSITORY" \
            --sortie-json "$RUNNER_TEMP/controle-veille.json" \
            --resume-markdown "$RUNNER_TEMP/controle-veille.md"

      - name: Afficher le bilan, y compris en cas de retard
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/controle-veille.md" ]]; then
            cat "$RUNNER_TEMP/controle-veille.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Contrôle non produit : inspecter les journaux de l'exécution." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver le bilan comme pièce d'exécution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-veille-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/controle-veille.json
            ${{ runner.temp }}/controle-veille.md
          if-no-files-found: warn
          retention-days: 30
