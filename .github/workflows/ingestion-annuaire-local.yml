name: Ingestion de l'annuaire local

# Contrôle en lecture seule des modifications proposées.
# Les trois collectes réelles sont traitées ensemble dans
# preparer-proposition-referentiel.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingerer_annuaire_local.py"
      - "scripts/rechercher_competence_geographique.py"
      - "scripts/verifier_variation_referentiel.py"
      - "tests/test_ingestion_annuaire_local.py"
      - "tests/test_recherche_competence_geographique.py"
      - "tests/test_snapshot_annuaire_local.py"
      - "tests/test_variation_referentiel.py"
      - ".github/workflows/ingestion-annuaire-local.yml"
      - ".github/workflows/preparer-proposition-referentiel.yml"

permissions:
  contents: read

concurrency:
  group: ${{ format('validation-{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  verification-proposition:
    name: Vérifier les transformations des services locaux en lecture seule
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Récupérer la proposition sans jeton persistant
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils de contrôle
        run: python -m pip install "pytest>=8,<10"

      - name: Contrôler les transformations et les données d'essai
        run: python -m pytest -q tests/test_ingestion_annuaire_local.py tests/test_recherche_competence_geographique.py tests/test_variation_referentiel.py tests/test_snapshot_annuaire_local.py

