name: "DECP : sept mois, identités et variantes"

on:
  push:
    branches: [main]
    paths:
      - "scripts/etendre_balayage_decp_sept_mois.py"
      - "tests/test_etendre_balayage_decp_sept_mois.py"
      - "scripts/balayer_fichiers_consolides_decp.py"
      - ".github/workflows/decp-sept-mois.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontiere-decp-sept-mois-v1
  cancel-in-progress: false

jobs:
  sept-mois:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Reconstituer sept mois et dédoublonner les marchés
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Lire la révision exacte du dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tester le balayage et les variantes sans réseau
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10"
          python -m pytest -q \
            tests/test_balayer_fichiers_consolides_decp.py \
            tests/test_etendre_balayage_decp_sept_mois.py

      - name: Restaurer exactement les trois fichiers et les sept contrats BOAMP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frontiere-sept-mois"
          mkdir -p "$ROOT/ancien" "$ROOT/chaines"
          gh run download 38481650597 \
            --repo "$GITHUB_REPOSITORY" \
            --name balayage-decp-consolides-3-mois-38481650597 \
            --dir "$ROOT/ancien"
          gh run download 38480457531 \
            --repo "$GITHUB_REPOSITORY" \
            --name chaines-documentaires-acheteurs-17-38480457531 \
            --dir "$ROOT/chaines"
          (
            cd "$ROOT/chaines"
            echo "8a9f220a66f61a4a0e1ea0104e3fd9c7a23395e791866e997b10922bfcaf82b8  chaines-documentaires-17.json" | sha256sum --check
          )
          (
            cd "$ROOT/ancien"
            echo "5ea20aa0b0b2e7fd81029ccb514b1c4f5bac514016cd1f333e435e5e0407bc3a  rapport.json" | sha256sum --check
            echo "cc15f6dc1b980bfa73f90b120bd61e731a94dd861a080be520b9c8797af02ae9  fichiers-officiels/decp-2025-08.json" | sha256sum --check
            echo "4813dcade685770115ba10a74837cdc3bf89b5418360f232de19aa7161420caf  fichiers-officiels/decp-2026-02.json" | sha256sum --check
            echo "8114588fa9e459fa88a193d959c65945587d7402d8f21f5254663a6cdadb1364  fichiers-officiels/decp-2026-04.json" | sha256sum --check
          )

      - name: Télécharger les quatre nouveaux mois et reconstruire les sept dénominateurs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frontiere-sept-mois"
          python scripts/etendre_balayage_decp_sept_mois.py \
            --chaines "$ROOT/chaines/chaines-documentaires-17.json" \
            --archives-precedentes "$ROOT/ancien" \
            --inventaire institutionnel/decp/etat_ressources.json \
            --sortie "$ROOT/extension"

      - name: Vérifier le bilan global et les preuves nécessaires
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "frontiere-sept-mois/extension/rapport.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          a = d["statistiques"]
          b = d["dedoublonnage_intermois"]
          if (d["nombre_fichiers_intacts_lus"] != 7
                  or len(d["mois_effectivement_parcourus"]) != 7
                  or d["contrats_juridiquement_demontrés"] != 0
                  or a["notices_marche_lues"] != a["notices_normalisees"] + a.get("notices_marche_rejetees", 0)
                  or a["notices_normalisees"] != b["observations_marche_normalisees"]
                  or b["observations_marche_normalisees"] !=
                     b["variantes_documentaires_distinctes"] + b["repetitions_de_variantes_identiques"]
                  or b["variantes_documentaires_distinctes"] <
                     b["identites_distinctes_siret_et_id_marche"]):
              raise SystemExit("Contrôle des dénominateurs ou de la preuve échoué")
          print(json.dumps({
              "mois": d["mois_effectivement_parcourus"],
              "mesures": d["statistiques"],
              "dedoublonnage": d["dedoublonnage_intermois"],
              "pistes_meme_acheteur": d["nombre_pistes_avec_siret_acheteur_identique"],
              "collisions_autres_acheteurs": d["nombre_references_collisions_autres_acheteurs"],
              "contrats_demontrés": 0,
          }, ensure_ascii=False))
          PY

      - name: Archiver les quatre fichiers officiels et le rapport reproductible
        uses: actions/upload-artifact@v4
        with:
          name: frontiere-decp-sept-mois-${{ github.run_id }}
          path: ${{ runner.temp }}/frontiere-sept-mois/extension/
          retention-days: 14
          if-no-files-found: error
