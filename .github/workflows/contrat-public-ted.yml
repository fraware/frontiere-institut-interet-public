name: Contrat public TED

on:
  pull_request:
    branches: [main]
    paths:
      - app/collecteur_ted_continu.py
      - scripts/sonder_ted_reelle.py
      - tests/test_sonder_ted_reelle.py
      - .github/workflows/contrat-public-ted.yml
  workflow_dispatch:
  schedule:
    - cron: "35 7 * * 2,5"

permissions:
  contents: read

jobs:
  sonde:
    name: Vérifier le contrat réel TED
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Interroger une journée récente de TED
        run: python -m scripts.sonder_ted_reelle --complet
