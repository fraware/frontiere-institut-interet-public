name: "Captures primaires des six pilotes BOAMP"

on:
  push:
    branches: [main]
    paths:
      - "scripts/collecter_notices_pilotes_boamp.py"
      - "scripts/preparer_dossiers_pilotes_boamp.py"
      - "evaluation/cas_pilotes_boamp_v1.json"
      - "tests/test_collecter_notices_pilotes_boamp.py"
      - "scripts/qualifier_captures_notices_boamp.py"
      - "tests/test_qualifier_captures_notices_boamp.py"
      - "scripts/reconstituer_chronologies_pilotes_boamp.py"
      - "tests/test_reconstituer_chronologies_pilotes_boamp.py"
      - "scripts/collecter_avis_lies_boamp.py"
      - "tests/test_collecter_avis_lies_boamp.py"
      - "scripts/capturer_avis_amont_boamp.py"
      - "scripts/inventorier_pieces_consultation_boamp.py"
      - "tests/test_preuves_amont_pieces_boamp.py"
      - "scripts/etudier_consultation_caen.py"
      - "tests/test_etudier_consultation_caen.py"
      - "evaluation/avis_amont_cibles_boamp_v1.json"
      - "evaluation/avis_amont_cibles_boamp_v2.json"
      - ".github/workflows/captures-notices-pilotes.yml"
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captures-primaires-boamp
  cancel-in-progress: false

jobs:
  capturer:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Capturer et contrôler les notices officielles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer la révision exacte
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier les règles de capture sans accès distant
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10"
          python -m pytest -q \
            tests/test_collecter_notices_pilotes_boamp.py \
            tests/test_qualifier_captures_notices_boamp.py \
            tests/test_reconstituer_chronologies_pilotes_boamp.py \
            tests/test_collecter_avis_lies_boamp.py \
            tests/test_preuves_amont_pieces_boamp.py \
            tests/test_etudier_consultation_caen.py

      - name: Capturer les six réponses auprès de la source officielle
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/captures-notices-pilotes"
          python scripts/collecter_notices_pilotes_boamp.py \
            --registre evaluation/cas_pilotes_boamp_v1.json \
            --sortie "$DOSSIER"
          python scripts/collecter_notices_pilotes_boamp.py --verifier "$DOSSIER"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "captures-notices-pilotes" / "rapport.json"
          bilan = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "cas": bilan["nombre_cas"],
              "notices_retrouvees": bilan["nombre_notices_retrouvees"],
              "notices_non_retrouvees": bilan["nombre_cas"] - bilan["nombre_notices_retrouvees"],
              "source": "DILA / BOAMP, relevé actuel",
              "observation": bilan["observe_le"],
          }, ensure_ascii=False))
          PY

      - name: Reconstituer la consultation initiale du radar de Caen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/etudier_consultation_caen.py \
            --captures "$RUNNER_TEMP/captures-notices-pilotes" \
            --sortie "$RUNNER_TEMP/consultation-initiale-caen"

      - name: Qualifier la nature documentaire et les liens des six avis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualifier_captures_notices_boamp.py \
            --captures "$RUNNER_TEMP/captures-notices-pilotes" \
            --registre evaluation/cas_pilotes_boamp_v1.json \
            --sortie "$RUNNER_TEMP/qualification-nature-avis.json"

      - name: Reconstituer les événements de contrat et les résultats par lot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconstituer_chronologies_pilotes_boamp.py \
            --captures "$RUNNER_TEMP/captures-notices-pilotes" \
            --registre evaluation/cas_pilotes_boamp_v1.json \
            --sortie "$RUNNER_TEMP/chronologies-pilotes.json"

      - name: Capturer les avis explicitement antérieurs aux rectificatifs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collecter_avis_lies_boamp.py \
            --principaux "$RUNNER_TEMP/captures-notices-pilotes" \
            --sortie "$RUNNER_TEMP/avis-anterieurs"
          python scripts/collecter_avis_lies_boamp.py \
            --principaux "$RUNNER_TEMP/captures-notices-pilotes" \
            --verifier "$RUNNER_TEMP/avis-anterieurs"

      - name: Capturer les avis amont préenregistrés et vérifier leurs références internes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capturer_avis_amont_boamp.py \
            --principaux "$RUNNER_TEMP/captures-notices-pilotes" \
            --lies "$RUNNER_TEMP/avis-anterieurs" \
            --registre evaluation/avis_amont_cibles_boamp_v2.json \
            --sortie "$RUNNER_TEMP/avis-amont"
          python scripts/capturer_avis_amont_boamp.py \
            --principaux "$RUNNER_TEMP/captures-notices-pilotes" \
            --lies "$RUNNER_TEMP/avis-anterieurs" \
            --registre evaluation/avis_amont_cibles_boamp_v2.json \
            --verifier "$RUNNER_TEMP/avis-amont"

      - name: Inventorier les références officielles aux pièces de consultation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventorier_pieces_consultation_boamp.py \
            --principaux "$RUNNER_TEMP/captures-notices-pilotes" \
            --lies "$RUNNER_TEMP/avis-anterieurs" \
            --amont "$RUNNER_TEMP/avis-amont" \
            --registre evaluation/avis_amont_cibles_boamp_v2.json \
            --sortie "$RUNNER_TEMP/inventaire-pieces-consultation.json"

      - name: Conserver les réponses exactes et leurs empreintes
        uses: actions/upload-artifact@v4
        with:
          name: notices-primaires-pilotes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/captures-notices-pilotes/
            ${{ runner.temp }}/qualification-nature-avis.json
            ${{ runner.temp }}/chronologies-pilotes.json
            ${{ runner.temp }}/avis-anterieurs/
            ${{ runner.temp }}/avis-amont/
            ${{ runner.temp }}/consultation-initiale-caen/
            ${{ runner.temp }}/inventaire-pieces-consultation.json
          retention-days: 30
          if-no-files-found: error
