name: Découverte récurrente des sources publiques

on:
  schedule:
    - cron: "11 1,7,13,19 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/decouvrir_sources_publiques.py"
      - "scripts/publier_mise_a_jour_institutionnelle.py"
      - "scripts/balayer_catalogue_national.py"
      - "scripts/decouvrir_catalogue_scientifique.py"
      - "institutionnel/decouverte/balayage_config_v1.json"
      - "institutionnel/decouverte/recherches_v1.json"
      - ".github/workflows/decouverte-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decouverte-sources-publiques
  cancel-in-progress: false

jobs:
  decouverte:
    name: Examiner les catalogues publics et publier les changements vérifiés
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Récupérer main sans conserver de jeton
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tester la découverte sans accès réseau
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_decouverte_sources_publiques.py tests/test_balayage_catalogue_national.py tests/test_decouverte_catalogue_scientifique.py tests/test_decouverte_publication.py tests/test_publication_institutionnelle.py

      - name: Interroger le catalogue national et conserver les notices
        run: python scripts/decouvrir_sources_publiques.py

      - name: Balayer progressivement le catalogue entier par pages
        run: python scripts/balayer_catalogue_national.py

      - name: Examiner le catalogue scientifique du ministère
        shell: bash
        run: |
          if python scripts/decouvrir_catalogue_scientifique.py; then
            echo "Catalogue scientifique mis à jour."
          else
            echo "::warning::Catalogue scientifique inaccessible : données antérieures préservées."
          fi

      - name: Publier les métadonnées uniquement dans une proposition distincte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publier_mise_a_jour_institutionnelle.py --source sources --publier

      - name: Attendre les trois vérifications puis fusionner uniquement des métadonnées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCHE="automatisation/sources-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOMBRE=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCHE" \
            --state open --json number --jq 'length')
          if [[ "$NOMBRE" == "0" ]]; then
            echo "Aucun changement à fusionner."
            exit 0
          fi
          if [[ "$NOMBRE" != "1" ]]; then
            echo "Nombre de propositions inattendu." >&2
            exit 1
          fi
          SHA=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Empreinte du lot invalide." >&2
            exit 1
          fi

          # Le jeton automatique ne déclenche pas les contrôles ordinaires
          # d'une proposition ; le programme de publication les a demandés
          # explicitement sur le commit exact du lot.
          IDENTIFIANT=""
          for tentative in $(seq 1 24); do
            IDENTIFIANT=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml --event workflow_dispatch --branch "$BRANCHE" \
              --limit 15 --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$SHA\")] | last | .databaseId // empty")
            if [[ -n "$IDENTIFIANT" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$IDENTIFIANT" ]]; then
            echo "Aucun contrôle explicite trouvé pour le commit proposé." >&2
            exit 1
          fi
          gh run watch "$IDENTIFIANT" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

          # Vérifier indépendamment les trois contrôles et leur provenance.
          CONTROLES=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name]')
          for nom in "Python 3.11" "Python 3.12" "Conteneur"; do
            if ! jq -e --arg nom "$nom" 'index($nom) != null' <<< "$CONTROLES" >/dev/null; then
              echo "Vérification obligatoire absente : $nom." >&2
              exit 1
            fi
          done
          FICHIERS=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" \
            --json files --jq '[.files[].path] | sort | .[]')
          while IFS= read -r chemin; do
            [[ -z "$chemin" ]] && continue
            case "$chemin" in
              institutionnel/decouverte/candidats_data_gouv.json|institutionnel/decouverte/etat_collecte.json|institutionnel/decouverte/balayage_etat.json|institutionnel/decouverte/balayage_pages/page_*.jsonl|institutionnel/decouverte/catalogue_mesr.json|institutionnel/decouverte/catalogue_mesr_etat.json) ;;
              *) echo "Fichier non autorisé : $chemin." >&2; exit 1 ;;
            esac
          done <<< "$FICHIERS"
          NOUVELLE_SHA=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          if [[ "$NOUVELLE_SHA" != "$SHA" ]]; then
            echo "Proposition modifiée depuis les tests." >&2
            exit 1
          fi
          gh pr merge "$BRANCHE" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
