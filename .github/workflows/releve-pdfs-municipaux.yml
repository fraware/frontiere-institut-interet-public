name: "Captures de pièces municipales primaires et empreintes PDF"

on:
  schedule:
    - cron: "37 5 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/relever_pdfs_municipaux.py"
      - "institutionnel/pieces_publiques/sources_pdfs_municipaux_v1.json"
      - "scripts/publier_mise_a_jour_institutionnelle.py"
      - "institutionnel/pieces_publiques/observations_pdfs_municipaux.json"
      - ".github/workflows/releve-pdfs-municipaux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontiere-pieces-pdf-municipales
  cancel-in-progress: false

jobs:
  collecte:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Récupérer main sans persistance du jeton
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier les normalisations sans réseau
        run: |
          python -m pip install "pytest>=8,<10" "pypdf>=5,<7"
          python -m pytest -q tests/test_relever_pdfs_municipaux.py tests/test_publication_institutionnelle.py

      - name: Capturer les trois PDF municipaux publics et extraire leurs repères
        run: python scripts/relever_pdfs_municipaux.py

      - name: Publier uniquement les empreintes et les repères de pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publier_mise_a_jour_institutionnelle.py --source pieces --publier

      - name: Vérifier la proposition et fusionner uniquement après trois réussites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCHE="automatisation/pieces-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOMBRE=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCHE" --state open --json number --jq 'length')
          if [[ "$NOMBRE" == "0" ]]; then
            echo "Aucune nouvelle observation à publier."
            exit 0
          fi
          [[ "$NOMBRE" == "1" ]] || { echo "Nombre de propositions inattendu" >&2; exit 1; }
          SHA=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Empreinte de proposition invalide" >&2; exit 1; }

          EXECUTION=""
          for tentative in $(seq 1 24); do
            EXECUTION=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event workflow_dispatch --branch "$BRANCHE" --limit 15 --json databaseId,headSha --jq "[.[] | select(.headSha == \"$SHA\")] | last | .databaseId // empty")
            [[ -n "$EXECUTION" ]] && break
            sleep 10
          done
          [[ -n "$EXECUTION" ]] || { echo "Aucune exécution de contrôles trouvée" >&2; exit 1; }
          gh run watch "$EXECUTION" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

          CONTROLES=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name]')
          for NOM in "Python 3.11" "Python 3.12" "Conteneur"; do
            jq -e --arg nom "$NOM" 'index($nom) != null' <<< "$CONTROLES" >/dev/null || {
              echo "Contrôle obligatoire absent : $NOM" >&2
              exit 1
            }
          done

          FICHIERS=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" --json files --jq '[.files[].path] | sort | .[]')
          [[ -n "$FICHIERS" ]] || { echo "Proposition sans fichier" >&2; exit 1; }
          while IFS= read -r CHEMIN; do
            case "$CHEMIN" in
              institutionnel/pieces_publiques/observations_pdfs_municipaux.json) ;;
              *) echo "Chemin non autorisé : $CHEMIN" >&2; exit 1 ;;
            esac
          done <<< "$FICHIERS"
          ACTUEL=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          [[ "$ACTUEL" == "$SHA" ]] || { echo "Le commit a changé depuis les contrôles" >&2; exit 1; }
          gh pr merge "$BRANCHE" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
