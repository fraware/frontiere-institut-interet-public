name: Contrôle de protection de main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Attester les règles administratives de main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Récupérer le code de la branche principale
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier le modèle sans accès réseau
        run: python scripts/verifier_protection_main.py --modele-seulement

      - name: Examiner les règles GitHub effectivement actives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verifier_protection_main.py --exiger
