name: "Avis liés des dix-sept dossiers BOAMP indépendants"

on:
  push:
    branches: [main]
    paths:
      - "scripts/suivre_avis_lies_independants_boamp.py"
      - "tests/test_suivre_avis_lies_independants_boamp.py"
      - ".github/workflows/suivi-avis-lies-independants.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontiere-avis-lies-independants-17
  cancel-in-progress: false

jobs:
  collecter:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Contrôler les avis cités et archiver les réponses officielles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrouver la révision étudiée
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier les contradictions documentaires sans réseau
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_suivre_avis_lies_independants_boamp.py

      - name: Restaurer les trente-six réponses officielles et les dix-sept dossiers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frontiere-liens"
          mkdir -p "$ROOT/boamp" "$ROOT/chaines"
          gh run download 38474330466 \
            --repo "$GITHUB_REPOSITORY" \
            --name index-public-boamp-38474330466 \
            --dir "$ROOT/boamp"
          gh run download 38480457531 \
            --repo "$GITHUB_REPOSITORY" \
            --name chaines-documentaires-acheteurs-17-38480457531 \
            --dir "$ROOT/chaines"
          (
            cd "$ROOT/boamp"
            echo "3626f84ccf9a39ce6d8882f0d5f7463eb6bde860c90a26904a6992f5fed791e3  audit-identifiants-acheteurs-36.json" | sha256sum --check
          )
          (
            cd "$ROOT/chaines"
            echo "8a9f220a66f61a4a0e1ea0104e3fd9c7a23395e791866e997b10922bfcaf82b8  chaines-documentaires-17.json" | sha256sum --check
          )

      - name: Recréer localement l'archive historique compacte
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frontiere-liens"
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          root = Path(os.environ["RUNNER_TEMP"]) / "frontiere-liens"
          dossier = root / "boamp"
          ancien = dossier / "releve-issues-36"
          fichiers = sorted(ancien.glob("*.json"))
          if len(fichiers) != 37:
              raise SystemExit("Les trente-six avis et leur manifeste sont incomplets")
          with ZipFile(root / "historique.zip", "w", compression=ZIP_STORED) as z:
              for fichier in fichiers:
                  z.write(fichier, "releve-issues-36/" + fichier.name)
          PY

      - name: Capturer uniquement les avis explicitement cités
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/frontiere-liens"
          python scripts/suivre_avis_lies_independants_boamp.py \
            --archive-boamp "$ROOT/historique.zip" \
            --chaines "$ROOT/chaines/chaines-documentaires-17.json" \
            --sortie "$ROOT/avis-lies"
          python scripts/suivre_avis_lies_independants_boamp.py \
            --archive-boamp "$ROOT/historique.zip" \
            --chaines "$ROOT/chaines/chaines-documentaires-17.json" \
            --verifier "$ROOT/avis-lies"
          python - <<'PY'
          import os, json
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "frontiere-liens/avis-lies/rapport.json"
          r = json.loads(p.read_text())
          attendu = {
              ("26-37752", "25-122175"),
              ("26-35619", "26-25119"),
              ("26-60102", "26-59281"),
          }
          codes = {(x["avis_source"], x["avis_lie"]) for x in r["avis_lies"]}
          if (codes != attendu or r["nombre_liens_explicites"] != 3
                  or r["nombre_avis_sources"] != 17
                  or r["nombre_identites_juridiques_confirmees"] != 0
                  or r["nombre_actes_contractuels_obtenus"] != 0):
              raise SystemExit("Dénominateurs ou statuts documentaires incohérents")
          print(json.dumps({
              "avis_sources": r["nombre_avis_sources"],
              "avis_lies_explicitement": 3,
              "reponses_trouvees": r["nombre_retrouves"],
              "statuts": [{
                  "avis_source": x["avis_source"], "avis_lie": x["avis_lie"],
                  "statut": x["statut_recherche"],
                  "reference": x["correspondance_reference_procedure"],
                  "numero_acheteur": x["concordance_numero_acheteur"],
              } for x in r["avis_lies"]],
              "actes_contractuels": 0,
          }, ensure_ascii=False))
          PY

      - name: Conserver les trois réponses BOAMP avec leurs empreintes
        uses: actions/upload-artifact@v4
        with:
          name: frontiere-avis-lies-17-${{ github.run_id }}
          path: ${{ runner.temp }}/frontiere-liens/avis-lies/
          retention-days: 30
          if-no-files-found: error
