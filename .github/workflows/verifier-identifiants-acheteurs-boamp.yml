name: "Vérification administrative des 16 identifiants BOAMP"

on:
  push:
    branches: [main]
    paths:
      - "scripts/verifier_identifiants_acheteurs_api_entreprises.py"
      - "tests/test_verifier_identifiants_acheteurs_api_entreprises.py"
      - ".github/workflows/verifier-identifiants-acheteurs-boamp.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: audit-identifiants-publics-boamp
  cancel-in-progress: false

jobs:
  verifier:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Contrôler les identifiants sans déduire les contrats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Lire la révision exacte
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier les règles d'interprétation sans réseau
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_verifier_identifiants_acheteurs_api_entreprises.py

      - name: Obtenir l'archive historique officielle sélectionnée
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RACINE="$RUNNER_TEMP/boamp-source"
          mkdir -p "$RACINE"
          gh run download 38474330466 \
            --repo "$GITHUB_REPOSITORY" \
            --name index-public-boamp-38474330466 \
            --dir "$RACINE"
          cd "$RACINE"
          echo "3626f84ccf9a39ce6d8882f0d5f7463eb6bde860c90a26904a6992f5fed791e3  audit-identifiants-acheteurs-36.json" | sha256sum --check --status
          echo "Archive sélectionnée : 36 avis, empreinte vérifiée."

      - name: Interroger l'API officielle à débit limité et archiver chaque réponse
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verifier_identifiants_acheteurs_api_entreprises.py \
            --audit-boamp "$RUNNER_TEMP/boamp-source/audit-identifiants-acheteurs-36.json" \
            --sortie "$RUNNER_TEMP/verification-acheteurs-16"

      - name: Publier uniquement le rapport et les réponses administratives originales
        uses: actions/upload-artifact@v4
        with:
          name: verification-administrative-acheteurs-16-${{ github.run_id }}
          path: ${{ runner.temp }}/verification-acheteurs-16/
          retention-days: 30
          if-no-files-found: error
