name: Ingestion du référentiel DILA

# Les collectes en écriture sont désormais coordonnées dans
# preparer-proposition-referentiel.yml. Cette procédure teste les changements.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingerer_roae.py"
      - "tests/test_ingestion_roae.py"
      - "tests/test_snapshot_roae.py"
      - ".github/workflows/ingestion-roae.yml"
      - ".github/workflows/preparer-proposition-referentiel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('validation-{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  verification:
    name: Vérifier le référentiel administratif sans écriture
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Récupérer le code à contrôler
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils d'essai
        run: python -m pip install "pytest>=8,<10"

      - name: Vérifier les transformations administratives
        run: python -m pytest -q tests/test_ingestion_roae.py tests/test_snapshot_roae.py
