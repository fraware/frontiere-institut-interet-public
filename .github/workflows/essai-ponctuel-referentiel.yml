name: Essai ponctuel du référentiel sans publication

# Déclencheur transitoire, à supprimer immédiatement après observation
# du lancement. Il ne possède aucun chemin vers une publication.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/essai-ponctuel-referentiel.yml"

permissions:
  contents: read

jobs:
  lancer-essai:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Demander une actualisation expérimentale sans publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Déclencher uniquement une observation technique
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run preparer-proposition-referentiel.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f publier=false
