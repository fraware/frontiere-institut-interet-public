name: "Besoins publics : emploi et marchés"

on:
  schedule:
    - cron: "23 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/collecter_besoins_publics.py"
      - "scripts/publier_mise_a_jour_institutionnelle.py"
      - "scripts/sonder_structure_offres_publiques.py"
      - "scripts/extraire_offres_publiques.py"
      - "scripts/collecter_historique_boamp.py"
      - "scripts/surveiller_revisions_boamp.py"
      - ".github/workflows/collecte-besoins-publics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collecte-besoins-publics
  cancel-in-progress: false

jobs:
  collecte:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Recueillir et publier les indices des besoins publics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Récupérer main sans jeton persistant
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier le collecteur hors connexion
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_collecte_besoins_publics.py tests/test_collecte_historique_boamp.py tests/test_surveiller_revisions_boamp.py tests/test_structure_offres_publiques.py tests/test_extraire_offres_publiques.py tests/test_publication_institutionnelle.py

      - name: Interroger les deux sources officielles
        run: python scripts/collecter_besoins_publics.py

      - name: Relever uniquement les colonnes du plus récent CSV d'emploi
        shell: bash
        run: |
          if python scripts/sonder_structure_offres_publiques.py; then
            echo "Colonnes du fichier d'emploi identifiées."
          else
            echo "::warning::Lecture des colonnes impossible : vérifier les conditions de téléchargement."
          fi

      - name: Extraire les lignes des offres publiques, sans coordonnées privées
        shell: bash
        run: |
          if python scripts/extraire_offres_publiques.py; then
            echo "Fichier officiel extrait en partitions, avec manifeste de provenance."
          else
            echo "::warning::Importation des offres incomplète : conserver les jeux précédents."
          fi

      - name: Compléter les archives BOAMP des journées closes
        shell: bash
        run: |
          if python scripts/collecter_historique_boamp.py --jours 24; then
            echo "Rattrapage historique BOAMP achevé pour ce lot."
          else
            echo "::warning::Rattrapage BOAMP indisponible : poursuivre les autres collectes sans publier de journée incomplète."
          fi

      - name: Réexaminer un échantillon tournant d'avis historiques BOAMP
        shell: bash
        run: |
          if python scripts/surveiller_revisions_boamp.py; then
            echo "Relecture rétrospective effectuée avec consignation des variations."
          else
            echo "::warning::Relecture BOAMP incomplète : conserver les constats antérieurs."
          fi

      - name: Soumettre les seules informations publiques autorisées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publier_mise_a_jour_institutionnelle.py --source besoins --publier

      - name: Attendre les trois vérifications puis fusionner uniquement des métadonnées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCHE="automatisation/besoins-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOMBRE=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCHE" \
            --state open --json number --jq 'length')
          if [[ "$NOMBRE" == "0" ]]; then
            echo "Aucun changement à fusionner."
            exit 0
          fi
          if [[ "$NOMBRE" != "1" ]]; then
            echo "Nombre de propositions inattendu." >&2
            exit 1
          fi
          SHA=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Empreinte du lot invalide." >&2
            exit 1
          fi

          # Le jeton automatique ne déclenche pas les contrôles ordinaires
          # d'une proposition ; le programme de publication les a demandés
          # explicitement sur le commit exact du lot.
          IDENTIFIANT=""
          for tentative in $(seq 1 24); do
            IDENTIFIANT=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml --event workflow_dispatch --branch "$BRANCHE" \
              --limit 15 --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$SHA\")] | last | .databaseId // empty")
            if [[ -n "$IDENTIFIANT" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$IDENTIFIANT" ]]; then
            echo "Aucun contrôle explicite trouvé pour le commit proposé." >&2
            exit 1
          fi
          gh run watch "$IDENTIFIANT" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

          # Vérifier indépendamment les trois contrôles et leur provenance.
          CONTROLES=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name]')
          for nom in "Python 3.11" "Python 3.12" "Conteneur"; do
            if ! jq -e --arg nom "$nom" 'index($nom) != null' <<< "$CONTROLES" >/dev/null; then
              echo "Vérification obligatoire absente : $nom." >&2
              exit 1
            fi
          done
          FICHIERS=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" \
            --json files --jq '[.files[].path] | sort | .[]')
          while IFS= read -r chemin; do
            [[ -z "$chemin" ]] && continue
            case "$chemin" in
              institutionnel/besoins_publics/annonces_boamp.json|institutionnel/besoins_publics/etat_boamp.json|institutionnel/besoins_publics/ressources_emplois_publics.json|institutionnel/besoins_publics/etat_emplois_publics.json|institutionnel/besoins_publics/schema_emplois_publics.json|institutionnel/besoins_publics/etat_schema_emplois_publics.json|institutionnel/besoins_publics/manifest_offres_postes.json|institutionnel/besoins_publics/offres_postes/lot_*.jsonl|institutionnel/besoins_publics/etat_historique_boamp.json|institutionnel/besoins_publics/historique_boamp/20??/??/20??-??-??.jsonl.gz|institutionnel/besoins_publics/historique_boamp/20??/??/20??-??-??.json|institutionnel/besoins_publics/etat_revisions_boamp.json|institutionnel/besoins_publics/revisions_boamp/20??/??/20??-??-??/[0-9a-f]*.jsonl.gz|institutionnel/besoins_publics/revisions_boamp/20??/??/20??-??-??/[0-9a-f]*.json) ;;
              *) echo "Fichier non autorisé : $chemin." >&2; exit 1 ;;
            esac
          done <<< "$FICHIERS"
          NOUVELLE_SHA=$(gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')
          if [[ "$NOUVELLE_SHA" != "$SHA" ]]; then
            echo "Proposition modifiée depuis les tests." >&2
            exit 1
          fi
          gh pr merge "$BRANCHE" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
