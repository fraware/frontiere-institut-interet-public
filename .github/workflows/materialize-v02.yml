name: materialize-v02
on:
  push:
    branches: ['field-ready/v0.2.0']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and expand source
        run: |
          cat bootstrap-v02/chunk*.b64 | base64 -d > /tmp/frontiere-source.zip
          unzip -t /tmp/frontiere-source.zip
          rm -rf /tmp/frontiere-source
          mkdir -p /tmp/frontiere-source
          unzip -q /tmp/frontiere-source.zip -d /tmp/frontiere-source
          cp -a /tmp/frontiere-source/frontiere-institut-interet-public/. .
          rm -rf bootstrap-v02 .github/workflows/materialize-v02.yml
      - name: Commit exact tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: make Frontière v0.2.0 field-ready"
          git push
