name: "Hygiène hebdomadaire des branches intégrées"

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/nettoyer_branches_fusionnees_hebdomadaire.py"
      - "tests/test_nettoyer_branches_fusionnees_hebdomadaire.py"
      - ".github/workflows/hygiene-branches-hebdomadaire.yml"

concurrency:
  group: hygiene-branche-hebdomadaire
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verifier:
    name: Valider les exclusions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tester les protections sans accès distant
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q \
            tests/test_nettoyer_branches_fusionnees.py \
            tests/test_nettoyer_branches_fusionnees_hebdomadaire.py

  nettoyer:
    name: Élaguer les seules PR intégrées depuis plus de 24 heures
    needs: [verifier]
    if: github.repository == 'fraware/frontiere-institut-interet-public' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Vérifier et élaguer uniquement les branches intégrées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.nettoyer_branches_fusionnees_hebdomadaire \
            --appliquer --rapport "$RUNNER_TEMP/hygiene-hebdomadaire.json"
      - name: Conserver le registre détaillé des décisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-branches-hebdomadaire
          path: ${{ runner.temp }}/hygiene-hebdomadaire.json
          retention-days: 30
          if-no-files-found: warn
