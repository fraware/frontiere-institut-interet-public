name: "Index documentaire des avis BOAMP historiques"

on:
  push:
    branches: [main]
    paths:
      - "institutionnel/besoins_publics/historique_boamp/**"
      - "institutionnel/besoins_publics/revisions_boamp/**"
      - "scripts/verifier_revisions_boamp.py"
      - "scripts/rechercher_historique_boamp.py"
      - "scripts/analyser_historique_boamp.py"
      - "scripts/constituer_pistes_boamp.py"
      - "scripts/echantillonner_avis_boamp.py"
      - "scripts/tirer_jeu_independant_boamp.py"
      - "tests/test_tirer_jeu_independant_boamp.py"
      - "scripts/analyser_complements_categories_boamp.py"
      - "institutionnel/besoins_publics/categories_boamp/**"
      - "scripts/auditer_echantillon_boamp.py"
      - "scripts/rapprocher_avis_attributions.py"
      - "scripts/preparer_dossiers_pilotes_boamp.py"
      - "evaluation/cas_pilotes_boamp_v1.json"
      - "institutionnel/marches_attribues/manifest.json"
      - "institutionnel/marches_attribues/quotidiens/**"
      - "scripts/croiser_pistes_capacites.py"
      - "scripts/evaluer_rappel_textuel.py"
      - "scripts/auditer_concentration_croisements.py"
      - "scripts/rechercher_capacites_institutionnelles.py"
      - "institutionnel/entites/**"
      - ".github/workflows/index-boamp-historique.yml"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-public-boamp
  cancel-in-progress: false

jobs:
  construire:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Vérifier et indexer les avis officiels archivés
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les archives publiées
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe du constructeur
        run: python -m compileall -q scripts/rechercher_historique_boamp.py scripts/verifier_revisions_boamp.py

      - name: Construire l'index en vérifiant chaque archive
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          mkdir -p "$DOSSIER"
          python scripts/rechercher_historique_boamp.py indexer \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            > "$DOSSIER/bilan-index.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sqlite3
          import subprocess
          import re

          dossier = Path(os.environ["RUNNER_TEMP"]) / "frontiere-boamp"
          base = dossier / "index-avis-boamp.sqlite3"
          bilan = json.loads((dossier / "bilan-index.json").read_text(encoding="utf-8"))
          with sqlite3.connect(f"file:{base}?mode=ro", uri=True) as con:
              jours = con.execute("SELECT COUNT(*) FROM provenance").fetchone()[0]
              avis = con.execute("SELECT COUNT(*) FROM recherche").fetchone()[0]
              versions = con.execute("SELECT COUNT(*) FROM versions WHERE version_originale = 0").fetchone()[0]
              jours_revises = con.execute("SELECT COUNT(*) FROM provenance WHERE revisions_verifiees > 0").fetchone()[0]
              retours = con.execute(
                  "SELECT COUNT(*) FROM provenance "
                  "WHERE revisions_verifiees > 0 AND sha256_retenue = sha256_initial"
              ).fetchone()[0]
              integrite = con.execute("PRAGMA integrity_check").fetchone()[0]
          if integrite != "ok" or (jours, avis) != (
              bilan["nombre_jours_indexes"], bilan["nombre_avis_indexes"]
          ) or versions != bilan["nombre_versions_corrigees_verifiees"] or jours_revises != bilan["nombre_jours_avec_revision"] or retours != bilan["retours_au_releve_initial_retenus"]:
              raise SystemExit("Index de recherche incohérent avec le bilan.")
          archives = Path("institutionnel/besoins_publics/historique_boamp")
          comprimés = sorted(archives.glob("20??/??/20??-??-??.jsonl.gz"))
          manifestes = sorted(archives.glob("20??/??/20??-??-??.json"))
          if len(comprimés) != jours or len(manifestes) != jours:
              raise SystemExit("Nombre d'archives et de manifestes incohérent.")
          revision_lue = subprocess.run(
              ["git", "rev-parse", "HEAD"], text=True,
              capture_output=True, check=True,
          ).stdout.strip()
          if not re.fullmatch(r"[0-9a-f]{40}", revision_lue):
              raise SystemExit("Révision réellement consultée incorrecte.")
          preuve = {
              "version": "publication-index-boamp-v1",
              "revision_depot": revision_lue,
              "revision_evenement_github": os.environ["GITHUB_SHA"],
              "jours_indexes": jours,
              "avis_indexes": avis,
              "versions_corrigees_verifiees": versions,
              "jours_avec_revision": jours_revises,
              "retours_au_releve_initial_retenus": retours,
              "choix_version": "dernier_etat_observe_et_verifie_par_jour",
              "octets_archives_compressees": sum(p.stat().st_size for p in comprimés),
              "octets_manifestes": sum(p.stat().st_size for p in manifestes),
              "octets_index": base.stat().st_size,
              "sha256_index": hashlib.sha256(base.read_bytes()).hexdigest(),
              "completude_historique_etablie": False,
              "validation_correction_institutionnelle": False,
          }
          (dossier / "preuve-index.json").write_text(
              json.dumps(preuve, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(preuve, ensure_ascii=False))
          PY

      - name: Produire un bilan documentaire descriptif lié à l'index
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/analyser_historique_boamp.py             --index "$DOSSIER/index-avis-boamp.sqlite3"             --preuve-index "$DOSSIER/preuve-index.json"             --sortie "$DOSSIER/bilan-documentaire.json"
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_analyser_historique_boamp.py

      - name: Constituer des pistes d'enquête documentaires bornées
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/constituer_pistes_boamp.py             --index "$DOSSIER/index-avis-boamp.sqlite3"             --preuve-index "$DOSSIER/preuve-index.json"             --bilan "$DOSSIER/bilan-documentaire.json"             --sortie "$DOSSIER/pistes-a-examiner.json"
          python -m pytest -q tests/test_constituer_pistes_boamp.py

      - name: Construire l'index documentaire des capacités publiques
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/rechercher_capacites_institutionnelles.py \
            --construire \
            --index "$DOSSIER/index-capacites-publiques.sqlite3" \
            > "$DOSSIER/bilan-capacites-publiques.json"
          python scripts/rechercher_capacites_institutionnelles.py \
            --verifier-index \
            --index "$DOSSIER/index-capacites-publiques.sqlite3" \
            > "$DOSSIER/verification-capacites-publiques.json"

      - name: Rapprocher les demandes documentaires et les capacités publiées
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/croiser_pistes_capacites.py \
            --index-boamp "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --bilan "$DOSSIER/bilan-documentaire.json" \
            --index-institutions "$DOSSIER/index-capacites-publiques.sqlite3" \
            --entites institutionnel/entites \
            --sortie "$DOSSIER/croisements-avis-capacites.json"
          python -m pytest -q tests/test_croiser_pistes_capacites.py

      - name: Auditer la diversité des passages et les répétitions documentaires
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/auditer_concentration_croisements.py \
            --croisements "$DOSSIER/croisements-avis-capacites.json" \
            --bilan-capacites "$DOSSIER/bilan-capacites-publiques.json" \
            --sortie-json "$DOSSIER/audit-concentration.json" \
            --sortie-md "$DOSSIER/audit-concentration.md"
          python -m pytest -q tests/test_auditer_concentration_croisements.py

      - name: Tirer des annonces comparables sur des mois intégralement couverts
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/echantillonner_avis_boamp.py \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --bilan "$DOSSIER/bilan-documentaire.json" \
            --quota 4 --semence frontiere-exploration-2026-10-v1 \
            --sortie "$DOSSIER/echantillon-temporel-boamp.json"
          python -m pytest -q tests/test_echantillonner_avis_boamp.py

      - name: Tirer les 36 avis techniques pour un examen indépendant
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python -m pytest -q tests/test_tirer_jeu_independant_boamp.py
          python scripts/tirer_jeu_independant_boamp.py \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --sortie "$DOSSIER/echantillon-independant-technique.json"

      - name: Rejouer intégralement le tirage et mesurer sa sensibilité
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/auditer_echantillon_boamp.py \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --echantillon "$DOSSIER/echantillon-temporel-boamp.json" \
            --sortie "$DOSSIER/contre-verification-echantillon.json"

      - name: Rapprocher les avis et les marchés attribués par identifiants exacts
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/rapprocher_avis_attributions.py \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --beauamp institutionnel/marches_attribues \
            --sortie "$DOSSIER/rapprochements-attributions.json"
          python -m pytest -q tests/test_rapprocher_avis_attributions.py

      - name: Vérifier les six cas pilotes et leurs liens BeauAMP éventuels
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/preparer_dossiers_pilotes_boamp.py \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --beauamp institutionnel/marches_attribues \
            --registre evaluation/cas_pilotes_boamp_v1.json \
            --sortie "$DOSSIER/dossiers-pilotes-documentaires.json"
          python -m pytest -q tests/test_rapprocher_avis_attributions.py

      - name: Évaluer le rappel des deux recherches sur les expressions exactes
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/evaluer_rappel_textuel.py \
            --index-boamp "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --bilan "$DOSSIER/bilan-documentaire.json" \
            --index-institutions "$DOSSIER/index-capacites-publiques.sqlite3" \
            --entites institutionnel/entites \
            --sortie "$DOSSIER/banc-rappel-textuel.json"
          python -m pytest -q tests/test_evaluer_rappel_textuel.py

      - name: Mesurer la couverture des catégories BOAMP réobservées
        shell: bash
        run: |
          set -euo pipefail
          DOSSIER="$RUNNER_TEMP/frontiere-boamp"
          python scripts/analyser_complements_categories_boamp.py \
            --index "$DOSSIER/index-avis-boamp.sqlite3" \
            --preuve-index "$DOSSIER/preuve-index.json" \
            --sources institutionnel/besoins_publics \
            --sortie "$DOSSIER/bilan-categories-reobservees.json"
          python -m pytest -q tests/test_analyser_complements_categories_boamp.py

      - name: Publier l'index vérifié en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: index-public-boamp-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frontiere-boamp/index-avis-boamp.sqlite3
            ${{ runner.temp }}/frontiere-boamp/bilan-index.json
            ${{ runner.temp }}/frontiere-boamp/preuve-index.json
            ${{ runner.temp }}/frontiere-boamp/bilan-documentaire.json
            ${{ runner.temp }}/frontiere-boamp/bilan-categories-reobservees.json
            ${{ runner.temp }}/frontiere-boamp/pistes-a-examiner.json
            ${{ runner.temp }}/frontiere-boamp/rapprochements-attributions.json
            ${{ runner.temp }}/frontiere-boamp/dossiers-pilotes-documentaires.json
            ${{ runner.temp }}/frontiere-boamp/echantillon-temporel-boamp.json
            ${{ runner.temp }}/frontiere-boamp/echantillon-independant-technique.json
            ${{ runner.temp }}/frontiere-boamp/contre-verification-echantillon.json
            ${{ runner.temp }}/frontiere-boamp/croisements-avis-capacites.json
            ${{ runner.temp }}/frontiere-boamp/banc-rappel-textuel.json
            ${{ runner.temp }}/frontiere-boamp/bilan-capacites-publiques.json
            ${{ runner.temp }}/frontiere-boamp/verification-capacites-publiques.json
            ${{ runner.temp }}/frontiere-boamp/audit-concentration.json
            ${{ runner.temp }}/frontiere-boamp/audit-concentration.md
          retention-days: 14
          if-no-files-found: error
