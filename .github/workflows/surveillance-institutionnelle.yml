name: Surveillance institutionnelle

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referentiel-institutionnel-main
  cancel-in-progress: false

jobs:
  surveillance:
    permissions:
      contents: write
    name: Actualiser l'état des sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt sans conserver de jeton
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils de test
        run: python -m pip install "pytest>=8,<10"

      - name: Surveiller les sources
        id: surveillance
        shell: bash
        run: |
          set +e
          python scripts/surveiller_sources_institutionnelles.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Vérifier la structure du référentiel
        run: python -m pytest -q tests/test_referentiel_institutionnel.py tests/test_surveillance_sources_institutionnelles.py

      - name: Enregistrer les observations en mode de continuité
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- institutionnel/etat_sources.json institutionnel/alertes_sources.json; then
            echo "Aucun changement observé."
            exit 0
          fi
          git add -- institutionnel/etat_sources.json institutionnel/alertes_sources.json
          git config user.name "frontiere-surveillance"
          git config user.email "frontiere-surveillance@users.noreply.github.com"
          git commit -m "Surveillance institutionnelle — état des sources"
          gh auth setup-git
          git push origin HEAD:main

      - name: Signaler une source critique indisponible
        if: steps.surveillance.outputs.code == '2'
        shell: bash
        run: |
          echo "Au moins une source critique est indisponible. L'état observé a été conservé."
          exit 2
