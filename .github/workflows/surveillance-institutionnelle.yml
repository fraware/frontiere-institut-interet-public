name: Surveillance institutionnelle

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referentiel-institutionnel-main
  cancel-in-progress: false

jobs:
  surveillance:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    name: Actualiser l'état des sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt sans conserver de jeton
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils de test
        run: python -m pip install "pytest>=8,<10"

      - name: Surveiller les sources
        id: surveillance
        shell: bash
        run: |
          set +e
          python scripts/surveiller_sources_institutionnelles.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Vérifier la structure du référentiel
        run: python -m pytest -q tests/test_referentiel_institutionnel.py tests/test_surveillance_sources_institutionnelles.py

      - name: Soumettre les observations en proposition distincte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publier_mise_a_jour_institutionnelle.py --source surveillance --publier

      - name: Signaler une source critique indisponible
        if: steps.surveillance.outputs.code == '2'
        shell: bash
        run: |
          echo "Au moins une source critique est indisponible. L'état observé a été conservé."
          exit 2
