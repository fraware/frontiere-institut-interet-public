name: Vérification ponctuelle des droits de proposition

# Vérification de droits uniquement : aucun document scientifique et aucune
# donnée institutionnelle ne sont publiés ni modifiés dans main.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verifier-publication-automatique-ponctuelle.yml"

permissions:
  contents: read

jobs:
  exercice:
    if: github.repository == 'fraware/frontiere-institut-interet-public'
    name: Créer puis retirer une proposition entièrement fictive
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Tester le droit de créer une proposition puis nettoyer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCHE="automatisation/exercice-droits-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          nettoyage() {
            gh pr close "$BRANCHE" --repo "$GITHUB_REPOSITORY" --delete-branch >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCHE" >/dev/null 2>&1 || true
          }
          trap nettoyage EXIT
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCHE" -f sha="$SHA" >/dev/null
          TEXTE=$(printf 'Essai entièrement fictif de droits GitHub Actions.\nAucune observation institutionnelle.\n' | base64 -w0)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/docs/EXERCICE_AUTOMATISATION_TEMPORAIRE.md" \
            -f message="Essai technique temporaire de proposition" \
            -f content="$TEXTE" -f branch="$BRANCHE" >/dev/null
          URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main \
            --head "$BRANCHE" --title "Exercice fictif des droits GitHub Actions" \
            --body "Exercice technique temporaire, sans données réelles. Proposition non destinée à une fusion.")
          echo "Proposition créée et consultée : $URL"
          gh pr view "$BRANCHE" --repo "$GITHUB_REPOSITORY" --json number,state >/dev/null
          echo "Le droit d'ouverture d'une proposition est établi pour ce jeton."
