name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app scripts tests

      - name: Vérifier la filiation du corpus versionné
        run: python scripts/auditer_filiation_chronologies.py

      - name: Vérifier le corpus public
        run: python scripts/verifier_corpus_public.py

      - name: Contrôler les passages des sources historiques
        run: python scripts/verifier_passages_sources.py

      - name: Vérifier les artefacts publics du jeu réservé
        run: python scripts/verifier_prevol_jeu_reserve.py

      - name: Détecter de nouvelles écritures directes vers main
        run: python scripts/auditer_ecritures_main.py

      - name: Vérifier le bilan publié des attributions DECP
        run: python -m scripts.verifier_coherence_bilan_decp

      - name: Exécuter les tests
        run: pytest



  recrutements_integraux:
    name: Recherche intégrale CSP
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Récupérer les partitions versionnées
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Contrôler les limites du moteur sur corpus synthétique
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_indexer_recrutements_nationaux_sqlite.py

      - name: Construire la recherche intégrale sur le véritable instantané
        run: |
          set -euo pipefail
          python -m scripts.indexer_recrutements_nationaux_sqlite construire \
            --base "$RUNNER_TEMP/frontiere-csp.sqlite3"
          python -m scripts.indexer_recrutements_nationaux_sqlite bilan \
            --base "$RUNNER_TEMP/frontiere-csp.sqlite3" > "$RUNNER_TEMP/bilan-csp.json"
          python - "$RUNNER_TEMP/bilan-csp.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          b = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (b["variantes_indexees"] != 268102
                  or b["references_distinctes"] != 266139
                  or b["references_multivariantes"] != 1168
                  or b["partitions_verifiees"] != 16
                  or b["couverture_nationale_demontree"] is not False
                  or b["recrutements_actuels_confirmes"] != 0):
              raise SystemExit("Population de recherche CSP inattendue.")
          print("Index national vérifié : 268 102 variantes, 266 139 références.")
          PY
          python -m scripts.indexer_recrutements_nationaux_sqlite rechercher \
            --base "$RUNNER_TEMP/frontiere-csp.sqlite3" \
            --reference 2026-2344611 > "$RUNNER_TEMP/recherche-csp.json"
          python - "$RUNNER_TEMP/recherche-csp.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (r["references_retournees"] != 1 or
                  r["resultats"][0]["reference"] != "2026-2344611"
                  or not r["resultats"][0]["sha256_ligne"]):
              raise SystemExit("Recherche de référence réelle incompatible.")
          PY


  commande_publique_integrale:
    name: Recherche intégrale BOAMP–DECP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lire les relevés versionnés
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tester l'intégrité et les rapprochements interdits
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_indexer_commande_publique_sqlite.py

      - name: Contrôler les archives BOAMP et DECP complètes
        run: |
          set -euo pipefail
          python -m scripts.indexer_commande_publique_sqlite construire \
            --base "$RUNNER_TEMP/commande-publique.sqlite3"
          python -m scripts.indexer_commande_publique_sqlite bilan \
            --base "$RUNNER_TEMP/commande-publique.sqlite3" > "$RUNNER_TEMP/bilan-commande.json"
          python - "$RUNNER_TEMP/bilan-commande.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (r["version"] != "frontiere-commande-publique-integrale-v1"
                  or r["avis_boamp"] != 5196
                  or r["marches_identites"] != 5643
                  or r["marches_variantes"] != 5665
                  or r["marches_attestations"] != 5946
                  or r["fichiers_decp"] != 47
                  or r["liaisons_boamp_decp_prouvees"] != 0
                  or r["couverture_nationale_demontree"] is not False):
              raise SystemExit("Population des deux archives incompatible.")
          print("BOAMP : 5 196 avis ; DECP : 5 643 identités / 5 665 variantes.")
          PY
          python -m scripts.indexer_commande_publique_sqlite rechercher \
            --base "$RUNNER_TEMP/commande-publique.sqlite3" \
            --identifiant 26-100001 > "$RUNNER_TEMP/avis.json"
          python -m scripts.indexer_commande_publique_sqlite rechercher \
            --base "$RUNNER_TEMP/commande-publique.sqlite3" \
            --identifiant '21590271900016/2025026000000000' > "$RUNNER_TEMP/marche.json"
          python - "$RUNNER_TEMP/avis.json" "$RUNNER_TEMP/marche.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          avis, marche = [json.loads(Path(p).read_text(encoding="utf-8"))
                         for p in sys.argv[1:]]
          if (avis["resultats_totaux"] != 1
                  or avis["resultats"][0]["source"] != "boamp"
                  or marche["resultats_totaux"] != 1
                  or marche["resultats"][0]["source"] != "decp"
                  or marche["resultats"][0]["siret_acheteur"] != "21590271900016"):
              raise SystemExit("Recherche de références primaires impossible.")
          PY


  index_public:
    name: Index documentaire
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tester les invariants et les fichiers de démonstration
        run: node --test tests/test_index_statique.mjs tests/test_recherche_navigateur.mjs tests/test_partitions_statiques.mjs tests/test_acheteurs_decp.mjs tests/test_rattachements_institutionnels.mjs tests/test_avis_boamp_corrobores.mjs tests/test_chronologies_documentaires.mjs tests/test_qualification_besoins.mjs

      - name: Construire l'index sur les vraies archives
        run: node scripts/construire_index_statique.mjs

      - name: Construire les partitions étendues
        run: node scripts/construire_partitions_statiques.mjs

      - name: Vérifier la cohérence de l'index étendu
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import crypto from 'node:crypto';
            const dir='site_frontiere/partitions/';
            const manifest=JSON.parse(fs.readFileSync(dir+'manifeste.json'));
            let count=0;
            for(const p of manifest.partitions) {
              const data=fs.readFileSync(dir+p.fichier);
              if(data.byteLength!==p.octets) process.exit(1);
              if(crypto.createHash('sha256').update(data).digest('hex')!==p.sha256) process.exit(1);
              if(JSON.parse(data).length!==p.documents) process.exit(1);
              count+=p.documents;
            }
            if(count<=1900) process.exit(1);
            console.log('Partitions attestées : '+count+' documents');
          "

      - name: Auditer la chaîne des archives vers le site
        run: |
          python scripts/auditer_chaine_publication.py \
            --revision "${{ github.sha }}" \
            --rapport "$RUNNER_TEMP/audit-chaine-documentaire.json"

      - name: Conserver le rapport transversal vérifié
        uses: actions/upload-artifact@v4
        with:
          name: audit-chaine-documentaire-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-chaine-documentaire.json
          retention-days: 14
          if-no-files-found: error

      - name: Contrôler les empreintes des rattachements DILA
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import crypto from 'node:crypto';
            const dir='site_frontiere/partitions/';
            const m=JSON.parse(fs.readFileSync(dir+'manifeste.json'));
            const p=m.rattachements_acheteurs;
            if(p.fichier!=='rattachements-acheteurs.json') process.exit(1);
            const bytes=fs.readFileSync(dir+p.fichier);
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            if(bytes.length!==p.octets || hash!==p.sha256) process.exit(1);
            const rapport=JSON.parse(bytes);
            if(rapport.version!==p.version ||
               rapport.documents_decp_indexes!==p.documents_decp_indexes ||
               rapport.sirets_decp_distincts!==p.sirets_decp_distincts ||
               rapport.verification_juridique_exterieure!==false) process.exit(1);
            const retenus=m.partitions.filter(x=>x.source==='decp')
              .reduce((n,x)=>n+x.documents,0);
            if(rapport.documents_decp_indexes!==retenus) process.exit(1);
            console.log('Rattachements exacts disponibles pour '+rapport.sirets_decp_distincts+' SIRET');
          "

      - name: Vérifier les deux avis BOAMP corroborés et leur empreinte
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import crypto from 'node:crypto';
            const racine='site_frontiere/partitions/';
            const m=JSON.parse(fs.readFileSync(racine+'manifeste.json'));
            const p=m.avis_boamp_corroborees;
            if(p?.fichier!=='avis-boamp-corrobores.json' ||
               p?.nombre_avis_etudies!==17 || p?.nombre_corroborees!==2) process.exit(1);
            const buf=fs.readFileSync(racine+p.fichier);
            if(buf.length!==p.octets ||
               crypto.createHash('sha256').update(buf).digest('hex')!==p.sha256) process.exit(1);
            const r=JSON.parse(buf);
            if(r.contrats_communs_demonstres!==0 ||
               r.avis.length!==2 ||
               r.sha256_registre_source!==p.empreinte_registre) process.exit(1);
            console.log('Avis BOAMP corroborés contrôlés : '+r.avis.length);
          "

      - name: Contrôler les qualifications documentaires de toutes les partitions
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const path='site_frontiere/partitions/';
            const m=JSON.parse(fs.readFileSync(path+'manifeste.json'));
            const q=m.qualification_besoins;
            const types={
              boamp:'avis_commande_publique_publie',
              emplois:'recrutement_public_annonce',
              decp:'marche_public_attribue_declare'
            };
            if(q?.version!=='frontiere-qualification-besoins-v1' ||
               q?.besoins_actuels_non_satisfaits_demonstres!==0 ||
               q?.projets_communs_demonstres!==0 ||
               q?.hypotheses_de_besoins!==0) process.exit(1);
            const compte={boamp:0,emplois:0,decp:0};
            for(const p of m.partitions){
              const docs=JSON.parse(fs.readFileSync(path+p.fichier));
              for(const d of docs){
                if(d.source!==p.source ||
                   d.qualification?.version!==q.version ||
                   d.qualification?.type!==types[d.source] ||
                   d.qualification?.etat_actuel!=='non_etabli' ||
                   d.qualification?.execution!=='non_etablie' ||
                   d.qualification?.besoin!==(
                     d.source==='emplois'?
                       'recherche_de_competences_a_la_publication':
                       d.source==='boamp'?'non_etablie':'besoin_actuel_non_etabli'
                   )) process.exit(1);
                compte[d.source]++;
              }
            }
            if(Object.values(compte).reduce((a,b)=>a+b,0)!==q.documents_qualifies ||
               q.sources.length!==3 ||
               q.sources.some(e=>e.documents!==compte[e.source] || e.type!==types[e.source]))
              process.exit(1);
            console.log('Qualifications documentaires contrôlées : '+q.documents_qualifies);
          "

      - name: Préparer et contrôler les candidats de relecture depuis les archives CSP
        run: |
          python -m scripts.preparer_relecture_besoins_explicites \
            --sortie "$RUNNER_TEMP/relecture-csp-24.json"
          python - "$RUNNER_TEMP/relecture-csp-24.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (r["nombre_candidats"] != 24 or
                  r["taille_par_strate"] != 12 or
                  r["representativite_statistique_etablie"] is not False or
                  r["relecture_humaine_effectuee"] is not False or
                  r["besoins_actuellement_non_satisfaits_demonstres"] != 0 or
                  len({x["reference"] for x in r["candidats"]}) != 24):
              raise SystemExit("Échantillon de relecture non conforme.")
          PY

      - name: Reconstituer les huit cas institutionnels et vérifier leurs preuves
        run: |
          python -m scripts.constituer_enquetes_institutionnelles \
            --sortie "$RUNNER_TEMP/enquetes-huit.json"
          python - "$RUNNER_TEMP/enquetes-huit.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          j = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (j["references_examinees"] != 8 or
                  j["partitions_integralement_verifiees"] != 16 or
                  j["variantes_lues"] != 268102 or
                  j["episodes_de_deficit_de_capacite_confirmes"] != 0 or
                  j["entretiens_realises"] != 0 or
                  j["validations_independantes_realisees"] != 0 or
                  len({d["reference"] for d in j["dossiers"]}) != 8 or
                  sum(j["compteurs_champ_competences"].values()) != 8 or
                  any(d["besoin_non_satisfait"] != "non_etabli"
                      for d in j["dossiers"])):
              raise SystemExit("Huit fiches ou limites de preuve incohérentes.")
          PY

      - name: Vérifier la taille et la portée de la publication
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p='site_frontiere/recherche-index.json';
            const doc=JSON.parse(fs.readFileSync(p,'utf8'));
            if(doc.portee!=='echantillon_documentaire_non_exhaustif'||doc.recherche_temps_reel!==false) process.exit(1);
            if(fs.statSync(p).size > 2_000_000) process.exit(1);
            for(const source of ['boamp','emplois','decp']) if(!doc.sources[source]?.retenus) process.exit(1);
            console.log('Index vérifié : '+doc.documents.length+' documents');
          "

  navigateur:
    name: Navigateur Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Chromium pour les essais fonctionnels
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Construire les deux index depuis les archives versionnées
        run: |
          node scripts/construire_index_statique.mjs
          node scripts/construire_partitions_statiques.mjs

      - name: Effectuer une recherche dans un vrai navigateur
        run: node --test tests/test_recherche_chromium.mjs

  conteneur:
    name: Conteneur
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t frontiere:test .

      - name: Construire l'image du collecteur BOAMP permanent
        run: docker build -f infra/Dockerfile.collecte -t frontiere-collecte:test .

      - name: Vérifier les six services Docker Compose
        run: docker compose -f compose.collecte.yml config --quiet

      - name: Construire l'image de consultation fédérée
        run: docker build -f infra/Dockerfile.consultation -t frontiere-consultation:test .

      - name: Construire l'image d'hébergement géré
        run: docker build -f infra/Dockerfile.hebergement -t frontiere-heberge:test .

      - name: Vérifier le service géré sans collecte réseau
        run: |
          docker run --detach --name frontiere-heberge-test \
            --env FRONTIERE_COLLECTE_ACTIVE=0 \
            --publish 127.0.0.1:18765:10000 frontiere-heberge:test
          for tentative in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18765/sante >/tmp/frontiere-gere-sante.json; then
              curl --fail --silent http://127.0.0.1:18765/exploitation > /tmp/frontiere-gere-volumes.json
              python -c "import json; d=json.load(open('/tmp/frontiere-gere-volumes.json')); assert d['sources_attendues']==3"
              docker rm -f frontiere-heberge-test
              exit 0
            fi
            sleep 1
          done
          docker logs frontiere-heberge-test
          docker rm -f frontiere-heberge-test
          exit 1

      - name: Vérifier le service
        run: |
          docker run --detach --name frontiere-test --publish 8000:8000 frontiere:test
          for tentative in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/frontiere-health.json; then
              cat /tmp/frontiere-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs frontiere-test
          exit 1
