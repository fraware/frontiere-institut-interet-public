name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app scripts tests

      - name: Exécuter les tests
        run: pytest


  conteneur:
    name: Conteneur
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t frontiere:test .

      - name: Vérifier le service
        run: |
          docker run --detach --name frontiere-test --publish 8000:8000 frontiere:test
          for tentative in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/frontiere-health.json; then
              cat /tmp/frontiere-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs frontiere-test
          exit 1
