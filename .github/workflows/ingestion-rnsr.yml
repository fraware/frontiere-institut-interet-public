name: Répertoire national des structures de recherche

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingerer_structures_rnsr.py"
      - "scripts/publier_mise_a_jour_institutionnelle.py"
      - ".github/workflows/ingestion-rnsr.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingerer_structures_rnsr.py"
      - "tests/test_ingestion_rnsr.py"
      - ".github/workflows/ingestion-rnsr.yml"
  workflow_dispatch:

# Les propositions externes ne possèdent que les permissions de lecture.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('referentiel-rnsr-pr-{0}', github.event.pull_request.number) || 'referentiel-institutionnel-main' }}
  cancel-in-progress: false

jobs:
  verification-proposition:
    if: github.event_name == 'pull_request'
    name: Vérifier les transformations RNSR sans écriture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupérer la proposition
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils d'essai
        run: python -m pip install "pytest>=8,<10"

      - name: Tester les importations fictives
        run: python -m pytest -q tests/test_ingestion_rnsr.py

  ingestion:
    if: github.event_name != 'pull_request'
    name: Préparer les structures publiques de recherche
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Récupérer la branche principale sans conserver de jeton
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils d'essai
        run: python -m pip install "pytest>=8,<10"

      - name: Vérifier l'importeur sur des données artificielles
        run: python -m pytest -q tests/test_ingestion_rnsr.py

      - name: Importer les structures officielles actives du RNSR
        run: python scripts/ingerer_structures_rnsr.py

      - name: Vérifier les données normalisées et le périmètre déclaré
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path

          dossier = Path("institutionnel")
          stats = json.loads((dossier / "statistiques_rnsr.json").read_text(encoding="utf-8"))
          manifeste = json.loads((dossier / "instantanes/rnsr_manifest.json").read_text(encoding="utf-8"))
          fichiers = sorted((dossier / "entites/rnsr").glob("*.jsonl"))
          ids = set()
          nombre = 0
          avec_domaines = 0
          assert len(fichiers) == manifeste["nombre_partitions"] == 8
          for fichier in fichiers:
              assert hashlib.sha256(fichier.read_bytes()).hexdigest() == manifeste["empreintes_partitions"][fichier.name]
              for ligne in fichier.read_text(encoding="utf-8").splitlines():
                  if not ligne.strip():
                      continue
                  item = json.loads(ligne)
                  assert item["famille"] == "recherche_publique"
                  assert item["etat"] == "ACTIF"
                  assert not item["capacites"]
                  assert not item["missions"]
                  assert item["id"].startswith("FRONTIERE-INST-RNSR-")
                  assert item["provenance"][0]["source_id"] == "mesr_rnsr_structures_actives"
                  assert all(x["nature"] == "PUBLIEE" for x in item["domaines_recherche"])
                  assert item["id"] not in ids
                  ids.add(item["id"])
                  nombre += 1
                  avec_domaines += bool(item["domaines_recherche"])
          assert nombre >= 3000
          assert stats["nombre_structures"] == manifeste["nombre_structures"] == nombre
          assert avec_domaines == stats["couverture"].get("avec_domaines_nommes", 0)
          assert stats["nombre_capacites_operationnelles_etablies"] == 0
          assert len(manifeste["sha256_semantique_source"]) == 64
          print(json.dumps({
              "structures": nombre,
              "domaines_publies": avec_domaines,
              "capacites_operationnelles_etablies": 0,
              "empreinte_source": manifeste["sha256_semantique_source"],
              "source": manifeste["source_id"],
              "verification_structurelle": True,
          }, ensure_ascii=False, indent=2))
          PY


      - name: Soumettre une proposition de mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publier_mise_a_jour_institutionnelle.py --source rnsr --publier
