services:
  collecte-boamp:
    build:
      context: .
      dockerfile: infra/Dockerfile.collecte
    restart: unless-stopped
    volumes:
      - stockage-frontiere-boamp:/var/lib/frontiere
      - ./institutionnel/besoins_publics:/opt/frontiere/archives:ro
    # Aucun port n'est publié : ce service acquiert et stocke les données.
    # La fréquence réelle des nouvelles annonces dépend du producteur BOAMP.

  collecte-emplois:
    build:
      context: .
      dockerfile: infra/Dockerfile.collecte
    restart: unless-stopped
    command:
      - python
      - -m
      - app.collecteur_emplois_continu
      - --base
      - sqlite:////var/lib/frontiere/offres_emplois.sqlite3
      - --repertoire
      - /var/lib/frontiere/releves
      - --suivre
      - --intervalle
      - "21600"
    volumes:
      - stockage-frontiere-emplois:/var/lib/frontiere
      - ./institutionnel/besoins_publics:/opt/frontiere/archives:ro
    # Fichier officiel DGAFP : vérifier le catalogue, télécharger le CSV
    # seulement après changement observé ou en cas de reprise incomplète.

  collecte-decp:
    build:
      context: .
      dockerfile: infra/Dockerfile.collecte
    restart: unless-stopped
    command:
      - python
      - -m
      - app.collecteur_decp_continu
      - --base
      - /var/lib/frontiere/marches_decp.sqlite3
      - --repertoire
      - /var/lib/frontiere/releves
      - --config
      - /opt/frontiere/archives-decp/sources_v1.json
      - --archives
      - /opt/frontiere/archives-decp
      - suivre
      - --intervalle
      - "21600"
    volumes:
      - stockage-frontiere-decp:/var/lib/frontiere
      - ./institutionnel/decp:/opt/frontiere/archives-decp:ro
    # Surveillance des catalogues DECP et lecture bornée des petits fichiers
    # officiels ; la couverture nationale des fichiers massifs n'est pas établie.

  collecte-decp-consolides:
    build:
      context: .
      dockerfile: infra/Dockerfile.collecte
    restart: unless-stopped
    command:
      - python
      - -m
      - app.collecteur_decp_consolides
      - --base
      - /var/lib/frontiere/marches_decp.sqlite3
      - --repertoire
      - /var/lib/frontiere/fichiers-consolides
      - suivre
      - --maximum
      - "2"
      - --intervalle
      - "21600"
    volumes:
      - stockage-frontiere-decp:/var/lib/frontiere
    # Les fichiers mensuels bruts sont archivés dans le même volume persistant.
    # L'index DECP est commun à la collecte AIFE/DGFiP et aux fichiers nationaux.

  collecte-ted:
    build:
      context: .
      dockerfile: infra/Dockerfile.collecte
    restart: unless-stopped
    command:
      - python
      - -m
      - app.collecteur_ted_continu
      - --base
      - /var/lib/frontiere/avis_ted.sqlite3
      - suivre
      - --jours
      - "4"
      - --intervalle
      - "7200"
    volumes:
      - stockage-frontiere-ted:/var/lib/frontiere
    # Interface TED Search API v3 : quatre dates réinterrogées toutes les 2 h.

  consultation:
    build:
      context: .
      dockerfile: infra/Dockerfile.consultation
    restart: unless-stopped
    environment:
      FRONTIERE_BOAMP_DB: /data/boamp/avis_boamp.sqlite3
      FRONTIERE_EMPLOIS_DB: /data/emplois/offres_emplois.sqlite3
      FRONTIERE_DECP_DB: /data/decp/marches_decp.sqlite3
      FRONTIERE_TED_DB: /data/ted/avis_ted.sqlite3
    volumes:
      - stockage-frontiere-boamp:/data/boamp:ro
      - stockage-frontiere-emplois:/data/emplois:ro
      - stockage-frontiere-decp:/data/decp:ro
      - stockage-frontiere-ted:/data/ted:ro
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/pret', timeout=12).read()"
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 15m
    # La disponibilité complète n'est déclarée que si les quatre volumes
    # contiennent effectivement des notices. /sante reste une sonde de vie.


  sauvegarde:
    image: python:3.12-slim
    profiles: ["maintenance"]
    restart: "no"
    command:
      - python
      - /opt/frontiere/sauvegarder_bases.py
      - --source
      - boamp=/data/boamp/avis_boamp.sqlite3
      - --source
      - emplois=/data/emplois/offres_emplois.sqlite3
      - --source
      - decp=/data/decp/marches_decp.sqlite3
      - --source
      - ted=/data/ted/avis_ted.sqlite3
      - --destination
      - /sauvegardes
    volumes:
      - stockage-frontiere-boamp:/data/boamp:ro
      - stockage-frontiere-emplois:/data/emplois:ro
      - stockage-frontiere-decp:/data/decp:ro
      - stockage-frontiere-ted:/data/ted:ro
      - ./scripts/sauvegarder_bases.py:/opt/frontiere/sauvegarder_bases.py:ro
      - ./sauvegardes:/sauvegardes
    # Exécution ponctuelle : copies SQLite cohérentes, à répliquer hors hôte.

volumes:
  stockage-frontiere-boamp:
  stockage-frontiere-emplois:
  stockage-frontiere-decp:
  stockage-frontiere-ted:
